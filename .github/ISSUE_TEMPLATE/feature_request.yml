name: 💡 Sugestão de Melhoria / Nova Funcionalidade
description: Sugira uma nova ideia, funcionalidade ou aprimoramento técnico para nossos projetos
title: "feat: "
labels: ["enhancement", "proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Adoramos sugestões e contribuições da comunidade! Descreva sua proposta para que possamos avaliar o impacto e viabilidade.
  - type: dropdown
    id: project
    attributes:
      label: Projeto Alvo
      description: A qual repositório ou ecossistema essa sugestão se destina?
      options:
        - "EmpireMuse (Bot de Música / Painel Web / Lavalink)"
        - "EmpireMuse-RPC-app (Desktop Rich Presence)"
        - "EmpireHub / EmpireBot (Plataforma Core / Bot de Jogos)"
        - "EmpireHubEngine (Phaser / Renderizador / Assets)"
        - "EmpireHubGames / GamesDevelopment (Catálogo de Jogos / SDK)"
        - "EmpireCommunitySite / EmpireHubSite (Portais Web / Astro)"
        - "EmpireCraft (Mod para Minecraft)"
        - "github-worker-relay (Cloudflare Workers / Webhooks)"
        - "Outro / Ecossistema Geral"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Qual problema, necessidade ou oportunidade essa sugestão atende?
      description: Explique a motivação prática por trás desta solicitação.
      placeholder: "Hoje quando fazemos X, percebemos que seria muito melhor se..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solução Proposta
      description: Descreva como você imagina o comportamento ideal desta funcionalidade.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas Consideradas
      description: Você considerou ou testou alguma outra abordagem ou contorno temporário?
  - type: textarea
    id: context
    attributes:
      label: Contexto Adicional
      description: Mockups, links de referência, documentação ou exemplos práticos.
