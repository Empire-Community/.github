name: 🐛 Relato de Bug / Defeito
description: Relate um erro ou comportamento inesperado em um projeto da Empire Community
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por dedicar seu tempo para relatar um problema! Por favor, preencha o formulário abaixo com o máximo de detalhes para facilitar a reprodução e correção.
  - type: input
    id: version
    attributes:
      label: Versão / Commit
      description: Qual versão do projeto ou hash de commit você está utilizando?
      placeholder: "ex.: v1.2.0 ou main (commit abc1234)"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Descrição do Problema
      description: Uma explicação concisa e precisa sobre o comportamento anormal ocorrido.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para Reproduzir
      description: Passo a passo sequencial para reproduzir o problema.
      value: |
        1. Executar '...'
        2. Chamar o comando '...'
        3. Observar o erro '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que deveria ter acontecido normalmente?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs e Mensagens de Erro
      description: Cole os logs relevantes ou tracebacks gerados pelo terminal (se houver código `ERR-XXXXXX`, inclua aqui).
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmações
      options:
        - label: Eu pesquisei nas issues abertas e fechadas e não encontrei duplicata deste relato.
          required: true
        - label: Certifiquei-me de que nenhum dado confidencial ou token está visível nos logs anexados.
          required: true
